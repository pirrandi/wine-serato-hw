# Hercules DJControl Inpulse 500 (USB 06f8:b12b). Tested.

# Name of the vendor ASIO driver on Windows; Serato looks it up by this name.
ASIO_NAME='DJControl Inpulse 500 ASIO'

# Empty registry keys (under HKLM) that the vendor driver installs and Serato checks.
# Serato reads the subkey name as the Hercules driver version.
DRIVER_KEYS=(
    'Software\Wow6432Node\Guillemot Corporation\DJHERCULESMIX Series Drivers\2.HDJS.2023'
)

# JACK ports wineasio connects to, in ASIO channel order (out 1-2 master, 3-4 headphones).
WINEASIO_OUTPUT_PORTS='^DJControl Inpulse 500 .*:playback_'
WINEASIO_INPUT_PORTS='^DJControl Inpulse 500 .*:capture_'
