# Copy to profiles/<vendor>-<model>.conf and fill in. See README, "Other controllers".

# Serato logs the name it wants: "Attempting to get connection, name=<ASIO_NAME>".
ASIO_NAME=''

# Registry keys (under HKLM, without the HKLM\ prefix) the vendor driver creates and
# Serato checks. Usually none outside Hercules. Each key's parent is recreated empty.
DRIVER_KEYS=()

# Regexes on JACK port names (`pw-link -io`, or "<node description>:<port>").
WINEASIO_OUTPUT_PORTS=''
WINEASIO_INPUT_PORTS=''
